<!DOCTYPE html>
<html lang="ja">
<head>

</header>

<nav id="quizList"></nav>

<main class="layout">

  <aside class="ad-box ad-left">
    <p>スポンサーリンク</p>
  </aside>

  <section class="quiz-box">
    <div class="status">
      <span id="counter">1 / 50</span>
      <span id="score">スコア: 0</span>
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <h2 id="question">読み込み中...</h2>

    <div id="choices"></div>

    <p id="result"></p>
  </section>

  <aside class="ad-box ad-right">
    <p>スポンサーリンク</p>

    <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
      crossorigin="anonymous"></script>

    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-8398161859137802"
      data-ad-slot="5599163841"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </aside>

</main>

<script src="data/kenpou.js"></script>
<script src="data/minpou.js"></script>
